      if(params.get('desktop')==='1'||params.get('app')==='0') return;
      var ua=navigator.userAgent||'';
      var isMobileUa=/Android|iPhone|iPod|Mobile|Windows Phone/i.test(ua);
      var isSmallTouch=false;
      try{isSmallTouch=window.matchMedia('(max-width: 820px)').matches&&navigator.maxTouchPoints>0;}catch(e){}
      if(!isMobileUa&&!isSmallTouch) return;
      var path=window.location.pathname||'/';
      var base=path.replace(/(?:index\.html)?$/,'');
      var target=base+'app/index.html';
      if(path!==target) window.location.replace(target+window.location.search+window.location.hash);
    })();
  </script>
