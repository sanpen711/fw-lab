    <div class="web-page-heading"><h1>小游戏</h1><p>不用登录，点开就玩；成绩和进度只保存在当前浏览器。</p></div>
    <div class="web-game-grid">
      <a class="web-game-card" href="desktop-v11/public/games/2048/index.html" data-game="2048" data-title="2048"><b>2048</b><span>合并相同数字，看看今天能摸到多高。</span><em>方向键操作</em></a>

<div class="game-stage" data-game-stage hidden>
  <div class="game-stage-card"><span class="game-stage-title" data-game-stage-title>小游戏</span><button class="game-stage-close" type="button" data-game-close>×</button><iframe title="小游戏" data-game-frame></iframe></div>
</div>
<script src="assets/app.js?v=web-sync-20260914-1"></script>
<script src="assets/web-sync-20260914.js?v=1"></script>
<script>
(function(){
  var stage=document.querySelector('[data-game-stage]'),frame=document.querySelector('[data-game-frame]'),title=document.querySelector('[data-game-stage-title]');
  document.addEventListener('click',function(e){var link=e.target.closest('[data-game]');if(!link)return;e.preventDefault();title.textContent=link.dataset.title||'小游戏';frame.src=link.getAttribute('href');stage.hidden=false;document.body.style.overflow='hidden';});
  function close(){stage.hidden=true;frame.src='about:blank';document.body.style.overflow='';}
  document.querySelector('[data-game-close]').addEventListener('click',close);stage.addEventListener('click',function(e){if(e.target===stage)close();});window.addEventListener('keydown',function(e){if(e.key==='Escape'&&!stage.hidden)close();});
})();
</script>
