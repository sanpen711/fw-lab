const STORAGE_KEY = 'my-study-notebook-1022-v1';
const MODE_NAMES = {order:'顺序练习',random:'随机练习',wrong:'错题本',favorite:'收藏夹',browse:'题库浏览'};
function emptyState() { return {version:1,records:{},wrong:[],favorites:[],daily:{},sessions:{},mode:'order',filter:'全部'}; }
function equalAnswers(a,b) { return [...a].sort().join('|') === [...b].sort().join('|'); }
function poolFor(questions,state,mode,filter='全部') {
  return questions.filter(q => (filter==='全部'||q.type===filter) && (mode!=='wrong'||state.wrong.includes(q.id)) && (mode!=='favorite'||state.favorites.includes(q.id)));
}
function createSession(questions,state,mode,filter='全部',rng=Math.random) {
  const ids=poolFor(questions,state,mode,filter).map(q=>q.id);
  if(mode==='random') for(let i=ids.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]];}
  return {ids,index:0,results:{},drafts:{},mode,filter};
}
function answerQuestion(state,session,q,selected,dateKey) {
  if(session.results[q.id] || !selected.length) return null;
  if(selected.some(k=>!q.options.some(o=>o.key===k))) return null;
  const correct=equalAnswers(selected,q.answer);
  const result={selected:[...selected].sort(),correct,answeredAt:new Date().toISOString()};
  session.results[q.id]=result; delete session.drafts[q.id];
  const record=state.records[q.id] || {attempts:0,correct:0};
  state.records[q.id]={attempts:record.attempts+1,correct:record.correct+(correct?1:0),latestCorrect:correct};
  if(correct) state.wrong=state.wrong.filter(id=>id!==q.id);
  else if(!state.wrong.includes(q.id)) state.wrong.push(q.id);
  state.daily[dateKey]=(state.daily[dateKey]||0)+1;
  return result;
}
function readState(value,questions) {
  const base=emptyState();
  if(!value||value.version!==1||typeof value.records!=='object'||!value.records) return base;
  const valid=new Set(questions.map(q=>q.id));
  base.records=Object.fromEntries(Object.entries(value.records).filter(([id,r])=>valid.has(id)&&r&&Number.isInteger(r.attempts)&&r.attempts>0&&Number.isInteger(r.correct)&&r.correct>=0&&r.correct<=r.attempts));
  for(const key of ['wrong','favorites']) base[key]=Array.isArray(value[key])?[...new Set(value[key].filter(id=>valid.has(id)))]:[];
  base.daily=value.daily&&typeof value.daily==='object'?Object.fromEntries(Object.entries(value.daily).filter(([k,n])=>/^\d{4}-\d{2}-\d{2}$/.test(k)&&Number.isInteger(n)&&n>=0)):{};
  base.mode=Object.hasOwn(MODE_NAMES,value.mode)?value.mode:'order';
  base.filter=['全部','单选','多选','判断'].includes(value.filter)?value.filter:'全部';
  if(value.sessions&&typeof value.sessions==='object') for(const [key,s] of Object.entries(value.sessions)) {
    if(!s||!Array.isArray(s.ids)||!Object.hasOwn(MODE_NAMES,s.mode)||!['全部','单选','多选','判断'].includes(s.filter))continue;
    const ids=[...new Set(s.ids.filter(id=>valid.has(id)))];
    const results={};
    for(const id of ids){const r=s.results?.[id],q=questions.find(q=>q.id===id); if(r&&Array.isArray(r.selected)&&r.selected.length&&r.selected.every(k=>q.options.some(o=>o.key===k))) results[id]={selected:[...new Set(r.selected)],correct:equalAnswers(r.selected,q.answer),answeredAt:String(r.answeredAt||'')};}
    const drafts={};for(const id of ids)if(Array.isArray(s.drafts?.[id]))drafts[id]=s.drafts[id].filter(k=>questions.find(q=>q.id===id).options.some(o=>o.key===k));
    base.sessions[key]={ids,index:Math.min(Math.max(0,Number.isInteger(s.index)?s.index:0),Math.max(ids.length-1,0)),results,drafts,mode:s.mode,filter:s.filter};
  }
  return base;
}

  const query=searchQuery.trim().toLocaleLowerCase(),qs=QUESTIONS.filter(q=>(state.filter==='全部'||q.type===state.filter)&&(!query||[q.text,...q.options.map(o=>o.text)].join(' ').toLocaleLowerCase().includes(query)));
  $('#browseCount').textContent=`共 ${qs.length} 道题 · 点击题目展开答案`;
  $('#browseList').innerHTML=qs.length?qs.map(q=>`<details class="browse-card"><summary><span class="browse-number">${String(q.number).padStart(2,'0')}</span><span>${esc(q.text)}</span><span class="type-tag">${q.type}</span></summary><div class="browse-options">${q.options.map(o=>`<div>${q.type==='判断'?'':o.key+'. '}${esc(o.text)}</div>`).join('')}</div><div class="browse-answer">正确答案：${q.answer.map(k=>q.type==='判断'?q.options.find(o=>o.key===k).text:k).join('、')}</div><div class="browse-actions"><button data-action="favorite" data-id="${q.id}">${state.favorites.includes(q.id)?'★ 已收藏':'☆ 收藏本题'}</button><button data-action="practice-id" data-id="${q.id}">练习这道题 →</button></div></details>`).join(''):'<section class="empty-state"><h2>没有找到匹配的题目</h2><p>换一个关键词，或切换题型再试试。</p></section>';
}
function selectOption(k){const s=currentSession(),q=currentQuestion();if(!q||s.results[q.id])return;const values=s.drafts[q.id]||[];s.drafts[q.id]=q.type==='多选'?(values.includes(k)?values.filter(x=>x!==k):[...values,k]):[k];save();renderQuiz();}
function submit(){const s=currentSession(),q=currentQuestion();if(!q)return;const result=answerQuestion(state,s,q,s.drafts[q.id]||[],today());if(!result)return;save();render();}
function move(delta){const s=currentSession();if(delta>0&&s.index===s.ids.length-1){openSummary();return;}s.index=Math.max(0,Math.min(s.ids.length-1,s.index+delta));save();renderQuiz();if(window.matchMedia('(max-width:720px)').matches)document.querySelector('.question-card')?.scrollIntoView({block:'start',behavior:'instant'});}
function dialog(html){$('#dialogContent').innerHTML=html;if(!$('#utilityDialog').open)$('#utilityDialog').showModal();}
const dialogHeader=title=>`<div class="dialog-header"><h2 id="dialogTitle">${title}</h2><button class="dialog-close" data-action="close-dialog" aria-label="关闭">×</button></div>`;
function openBackup(){dialog(`${dialogHeader('把练习进度带走')}<p class="dialog-description">进度保存在当前浏览器。更换设备、浏览器或清理缓存前，可以先导出一份备份。</p><div class="backup-choice"><div><b>导出进度</b><p>包含答题记录、错题、收藏和当前进度</p></div><button class="secondary-button" data-action="export">导出备份</button></div><div class="backup-choice"><div><b>恢复进度</b><p>从之前导出的备份文件恢复</p></div><button class="secondary-button" data-action="import">选择文件</button><input type="file" id="importFile" accept="application/json,.json" hidden></div><p class="import-note">恢复会替换当前浏览器的练习进度，请先导出现有进度。备份文件只在浏览器里读取。</p>`);}
function openSummary(){const s=currentSession(),answered=s.ids.filter(id=>s.results[id]).length,correct=s.ids.filter(id=>s.results[id]?.correct).length,unanswered=s.ids.length-answered;dialog(`${dialogHeader(unanswered?'本轮练习回顾':'这一轮，练完了')}<p class="dialog-description">${unanswered?`还有 ${unanswered} 道题没有提交，可以继续补齐。`:'给认真练习的自己一个小小的肯定。错题已经自动收好。'}</p><div class="summary-stats"><div><strong>${answered}</strong><span>已答题目</span></div><div><strong>${correct}</strong><span>答对题目</span></div><div><strong>${answered?Math.round(correct/answered*100)+'%':'—'}</strong><span>本轮正确率</span></div></div><div class="summary-actions">${unanswered?'<button class="primary-button" data-action="continue-unanswered">继续未答题</button>':'<button class="primary-button" data-action="restart-confirmed">再练一轮</button>'}<button class="secondary-button" data-action="summary-wrong">复习错题</button></div>`);}
function openAnswerCard(){const s=currentSession();dialog(`${dialogHeader('本轮答题卡')}<p class="dialog-description">已答 ${s.ids.filter(id=>s.results[id]).length} / ${s.ids.length} 题，点击题号跳转。</p><div class="mobile-dialog-grid">${s.ids.map((id,i)=>`<button class="grid-number ${i===s.index?'current':''} ${s.results[id]?(s.results[id].correct?'is-correct':'is-wrong'):s.drafts[id]?.length?'has-draft':''}" data-action="dialog-jump" data-index="${i}" aria-label="跳转第 ${i+1} 题">${i+1}</button>`).join('')}</div><div class="legend"><span><i class="good"></i>答对</span><span><i class="bad"></i>答错</span><span><i></i>未答</span></div>`);}
function restart(){if(state.mode==='browse'){openBackup();return;}const s=currentSession();if(!Object.keys(s.results).length&&!Object.keys(s.drafts).length){restartConfirmed();return;}dialog(`${dialogHeader('开始新一轮练习')}<p class="dialog-description">本轮答题卡会重新开始。累计练习记录、错题和收藏都会保留。</p><div class="summary-actions"><button class="primary-button" data-action="restart-confirmed">开始新一轮</button><button class="secondary-button" data-action="close-dialog">继续这一轮</button></div>`);}
function restartConfirmed(){state.sessions[key()]=createSession(QUESTIONS,state,state.mode,state.filter);$('#utilityDialog').close();save();render();toast(state.mode==='random'?'题目已重新打乱':'新一轮练习已准备好');}
function exportBackup(){const data={...state,backupFor:'my-study-notebook-1022',exportedAt:new Date().toISOString()},blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`刷题进度-${today()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('已导出进度备份');}
async function importBackup(file){if(!file)return;if(file.size>2000000){toast('文件过大，请选择正确的进度备份');return;}try{const raw=JSON.parse(await file.text());if(raw.backupFor!=='my-study-notebook-1022'||raw.version!==1||!raw.records)throw Error('invalid');const next=readState(raw,QUESTIONS);dialog(`${dialogHeader('恢复这份练习进度')}<p class="dialog-description">备份中有 ${Object.keys(next.records).length} 道已练题目、${next.wrong.length} 道错题和 ${next.favorites.length} 道收藏。恢复后会替换当前浏览器的进度。</p><div class="summary-actions"><button class="primary-button" id="restoreBackupButton">确认恢复</button><button class="secondary-button" data-action="close-dialog">取消</button></div>`);$('#restoreBackupButton').addEventListener('click',()=>{state=next;save();$('#utilityDialog').close();render();toast('练习进度已恢复');},{once:true});}catch{toast('无法识别文件，请选择本工具导出的 JSON 备份');}}
document.addEventListener('click',event=>{const button=event.target.closest('[data-action]');if(!button||button.disabled)return;const action=button.dataset.action;
  if(action==='mode'){startMode(button.dataset.mode);return;}
  if(action==='filter'){state.filter=button.dataset.type;save();render();return;}
  if(action==='option'){selectOption(button.dataset.key);return;}
  if(action==='submit'){submit();return;}
  if(action==='previous'){move(-1);return;}if(action==='next'){move(1);return;}
  if(action==='jump'){currentSession().index=Number(button.dataset.index);save();renderQuiz();return;}
  if(action==='answer-card'){openAnswerCard();return;}
  if(action==='dialog-jump'){currentSession().index=Number(button.dataset.index);$('#utilityDialog').close();save();renderQuiz();window.scrollTo({top:0,behavior:'smooth'});return;}
  if(action==='favorite'){const id=button.dataset.id;state.favorites=state.favorites.includes(id)?state.favorites.filter(x=>x!==id):[...state.favorites,id];save();if(state.mode==='browse'){const details=button.closest('details');button.textContent=state.favorites.includes(id)?'★ 已收藏':'☆ 收藏本题';renderHeader();}else render();return;}
  if(action==='retry'){const s=currentSession(),q=currentQuestion();if(q){delete s.results[q.id];delete s.drafts[q.id];save();render();}return;}
  if(action==='restart'){restart();return;}if(action==='restart-confirmed'){restartConfirmed();return;}
  if(action==='close-dialog'){$('#utilityDialog').close();return;}if(action==='backup'){openBackup();return;}
  if(action==='export'){exportBackup();return;}if(action==='import'){$('#importFile').click();return;}
  if(action==='continue-unanswered'){const s=currentSession();s.index=s.ids.findIndex(id=>!s.results[id]);$('#utilityDialog').close();save();render();return;}
  if(action==='summary-wrong'){$('#utilityDialog').close();state.filter='全部';startMode('wrong',true);return;}
  if(action==='practice-id'){state.mode='order';state.filter='全部';const s=currentSession();s.index=s.ids.indexOf(button.dataset.id);save();render();window.scrollTo({top:0,behavior:'smooth'});return;}
});
document.addEventListener('input',event=>{if(event.target.id==='questionSearch'){searchQuery=event.target.value;renderBrowseList();}});
document.addEventListener('change',event=>{if(event.target.id==='importFile')importBackup(event.target.files[0]);});
document.addEventListener('keydown',event=>{if($('#utilityDialog').open||state.mode==='browse'||['INPUT','TEXTAREA','SELECT','BUTTON'].includes(event.target.tagName)||event.altKey||event.ctrlKey||event.metaKey)return;const q=currentQuestion();if(!q)return;if(event.key==='Enter'){event.preventDefault();if(currentSession().results[q.id])move(1);else submit();}else if(event.key==='ArrowRight'){event.preventDefault();move(1);}else if(event.key==='ArrowLeft'){event.preventDefault();move(-1);}else{const k=event.key.toUpperCase();if(q.options.some(o=>o.key===k))selectOption(k);}});
$('#utilityDialog').addEventListener('click',event=>{if(event.target===$('#utilityDialog')){const r=event.target.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)event.target.close();}});
render();save();

</script>
</body></html>
