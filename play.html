  <style>
    .party-page{width:min(1180px,calc(100% - 72px));margin:0 auto;padding:42px 0 72px}.party-head{display:flex;align-items:end;justify-content:space-between;gap:18px}.party-head h1{margin:0;font-size:46px;letter-spacing:-.06em}.party-head p{margin:9px 0 0;color:#737b78;font-weight:700}.party-actions{display:flex;gap:8px}.party-actions button,.party-tabs button,.party-btn{min-height:40px;padding:0 14px;border:1px solid #e4ddd3;border-radius:11px;background:#fff;color:#152b25;font-weight:900;cursor:pointer}.party-actions .primary,.party-btn.primary{border-color:#152b25;background:#152b25;color:#fff}.party-tabs{display:flex;gap:7px;margin-top:22px}.party-tabs button.active{border-color:#ff969e;background:#ffe5e8;color:#d85965}.party-layout{display:grid;grid-template-columns:minmax(0,.9fr) minmax(360px,1.1fr);gap:18px;margin-top:16px}.party-list,.party-detail{min-height:560px;border:1px solid #e4ddd3;border-radius:18px;background:#fff}.party-list{padding:12px}.party-room{display:grid;gap:7px;width:100%;padding:15px;border:0;border-bottom:1px solid #eee9e3;background:#fff;color:#152b25;text-align:left;cursor:pointer}.party-room:last-child{border-bottom:0}.party-room:hover,.party-room.active{border-radius:12px;background:#fff7f8}.party-room-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.party-room b{font-size:15px}.party-room small{color:#737b78;font-size:10px}.party-room-meta{display:flex;gap:6px;flex-wrap:wrap}.party-room-meta span{padding:4px 7px;border-radius:999px;background:#f6f3ef;color:#5c6662;font-size:9px;font-weight:850}.party-detail{padding:22px;overflow:auto}.party-empty{display:grid;min-height:500px;place-items:center;color:#939b98;font-weight:800}.party-detail h2{margin:0 0 8px;font-size:27px}.party-detail .sub{margin:0;color:#737b78;line-height:1.7}.party-info{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:18px 0}.party-info div{padding:11px;border-radius:12px;background:#faf8f5}.party-info small{display:block;color:#8b928f;font-size:9px}.party-info b{display:block;margin-top:4px;font-size:12px}.party-section{margin-top:20px;padding-top:18px;border-top:1px solid #eee9e3}.party-section h3{margin:0 0 10px;font-size:14px}.party-member{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid #f1ede8;font-size:11px}.party-member span{color:#737b78}.party-form{display:grid;gap:10px}.party-form label{display:grid;gap:6px;color:#45524e;font-size:10px;font-weight:900}.party-form input,.party-form textarea{width:100%;border:1px solid #e4ddd3;border-radius:10px;background:#fff;padding:0 11px;color:#152b25}.party-form input{height:42px}.party-form textarea{min-height:88px;padding:11px;resize:vertical}.party-form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.party-check{display:flex!important;grid-column:1/-1;flex-direction:row!important;align-items:center;gap:7px!important}.party-check input{width:auto;height:auto}.party-msgs{display:grid;gap:7px;max-height:210px;overflow:auto;padding:8px;border-radius:12px;background:#faf8f5}.party-msg{padding:8px 10px;border-radius:10px;background:#fff;font-size:10px;line-height:1.5}.party-msg b{display:block;margin-bottom:3px}.party-chat{display:grid;grid-template-columns:1fr auto;gap:7px;margin-top:8px}.party-chat input{height:40px;border:1px solid #e4ddd3;border-radius:10px;padding:0 10px}.party-status{min-height:18px;margin-top:8px;color:#8a6d67;font-size:10px;font-weight:800}.party-status.error{color:#c84f5b}.party-modal[hidden]{display:none}.party-modal{position:fixed;inset:0;z-index:25000;display:grid;place-items:center;padding:22px;background:rgba(15,20,18,.35);backdrop-filter:blur(5px)}.party-modal-card{position:relative;width:min(620px,100%);max-height:90vh;overflow:auto;padding:24px;border-radius:20px;background:#fff}.party-modal-close{position:absolute;right:13px;top:12px;width:34px;height:34px;border:0;border-radius:50%;background:#f2efeb;font-size:20px;cursor:pointer}@media(max-width:920px){.party-page{width:min(100% - 32px,680px);padding-top:28px}.party-head{display:block}.party-actions{margin-top:14px}.party-layout{grid-template-columns:1fr}.party-detail{min-height:0}.party-form-grid,.party-info{grid-template-columns:1fr}}

<body>
<main class="page">
  <header class="header dark"><a class="logo" href="index.html">F.w 研究所</a><nav class="nav"><a href="index.html">首页</a><a href="square.html">精神广场</a><a href="rooms.html">学术研讨</a><a href="bird.html">新闻专区</a><a class="active" href="play.html">下班开黑</a></nav><button class="menu-btn" aria-label="菜单">☰</button></header>

  <section class="party-page">
    <div class="party-head"><div><h1>下班开黑</h1><p>先认识今晚的队友，确认加入后再交换游戏 ID。</p></div><div class="party-actions"><button type="button" data-party-refresh>刷新</button><button class="primary" type="button" data-party-create>创建组队</button></div></div>
    <div class="party-tabs"><button class="active" type="button" data-filter="open">可加入</button><button type="button" data-filter="all">全部房间</button><button type="button" data-filter="mine">我的组队</button></div>
    <div class="party-status" data-page-status></div>
    <div class="party-layout"><section class="party-list" data-party-list><div class="party-empty">正在读取组队房间…</div></section><aside class="party-detail" data-party-detail><div class="party-empty">选择一个组队房间</div></aside></div>
  </section>
  <footer class="footer"><span>F.w 研究所</span><span>下班开黑 / After Work Squad</span></footer>
</main>
<div class="party-modal" data-create-modal hidden><div class="party-modal-card"><button class="party-modal-close" type="button" data-create-close>×</button><h2 style="margin:0 0 7px">创建组队</h2><p style="margin:0 0 18px;color:#737b78;font-size:11px">除游戏名称外均可不填；每人最多创建 5 个，会员最多 15 个。</p><form class="party-form" data-create-form><div class="party-form-grid"><label style="grid-column:1/-1">游戏名称 *<input name="gameName" maxlength="30" required placeholder="例如：英雄联盟"></label><label>服务器 / 区服<input name="serverName" maxlength="30" placeholder="可不填"></label><label>游戏模式<input name="mode" maxlength="30" placeholder="自由填写"></label><label>开黑时间<input name="startsAt" maxlength="40" placeholder="例如：今晚 8 点"></label><label>人数<input name="capacity" type="number" min="2" max="20" placeholder="可不填"></label><label style="grid-column:1/-1">你的游戏 ID<input name="gameId" maxlength="60" placeholder="确认加入后再向队友显示"></label><label style="grid-column:1/-1">备注<textarea name="note" maxlength="300" placeholder="想说点什么都可以"></textarea></label><label class="party-check"><input type="checkbox" name="requiresApproval" checked> 进队需要申请</label></div><div class="party-status" data-create-status></div><button class="party-btn primary" type="submit">创建组队</button></form></div></div>
<script src="assets/app.js?v=web-sync-20260914-1"></script><script src="assets/web-sync-20260914.js?v=1"></script>
<script>
(function(){
  var state={parties:[],members:[],contacts:[],profiles:{},messages:[],user:null,filter:'open',openId:''};var $=function(s,r){return (r||document).querySelector(s)}, $$=function(s,r){return Array.from((r||document).querySelectorAll(s))};
  function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function setStatus(t,e){var n=$('[data-page-status]');n.textContent=t||'';n.classList.toggle('error',!!e)}function setCreateStatus(t,e){var n=$('[data-create-status]');n.textContent=t||'';n.classList.toggle('error',!!e)}
  async function waitDb(){for(var i=0;i<60;i++){if(window.fwDb&&window.fwDb.enabled&&window.fwDb.client)return window.fwDb;await new Promise(function(r){setTimeout(r,100)})}return null}function client(){return window.fwDb&&window.fwDb.client}async function getUser(){var c=client();if(!c)return null;var s=await c.auth.getSession();return s.data.session&&s.data.session.user||null}function requireUser(){if(state.user)return state.user;window.__FW_OPEN_AUTH__&&window.__FW_OPEN_AUTH__();throw new Error('请先登录。')}
  async function load(){setStatus('正在读取…');var fw=await waitDb();if(!fw)throw new Error('数据服务暂时不可用。');state.user=await getUser();var pr=await fw.client.from('game_parties').select('id,captain_id,game_name,platform,server_name,mode,starts_at,starts_at_text,capacity,member_count,note,requires_approval,status,created_at,updated_at').in('status',['open','full']).order('created_at',{ascending:false}).limit(100);if(pr.error)throw pr.error;state.parties=pr.data||[];var ids=state.parties.map(function(p){return p.id});state.members=[];state.contacts=[];if(state.user&&ids.length){var mr=await fw.client.from('game_party_members').select('party_id,user_id,role,state,request_message,created_at,updated_at').in('party_id',ids);if(!mr.error)state.members=mr.data||[];var cr=await fw.client.from('game_party_contacts').select('party_id,user_id,game_id,updated_at').in('party_id',ids);if(!cr.error)state.contacts=cr.data||[]}var pids=Array.from(new Set(state.parties.map(function(p){return p.captain_id}).concat(state.members.map(function(m){return m.user_id})).filter(Boolean)));state.profiles={};if(pids.length){var rr=await fw.client.from('profiles').select('id,nickname,avatar_url').in('id',pids);(rr.data||[]).forEach(function(p){state.profiles[String(p.id)]=p})}renderList();if(state.openId&&state.parties.some(function(p){return String(p.id)===String(state.openId)}))await openParty(state.openId);else renderDetail(null);setStatus('')}
  function memberFor(party,user){return state.members.find(function(m){return String(m.party_id)===String(party.id)&&String(m.user_id)===String(user&&user.id)})}function mine(p){return state.user&&(String(p.captain_id)===String(state.user.id)||!!memberFor(p,state.user))}function visible(){return state.parties.filter(function(p){if(state.filter==='mine')return mine(p);if(state.filter==='open')return p.status==='open'&&Number(p.member_count||0)<Number(p.capacity||999);return true})}
  function renderList(){var host=$('[data-party-list]'),rows=visible();host.innerHTML=rows.length?'':'<div class="party-empty">暂时没有符合条件的房间。</div>';rows.forEach(function(p){var captain=state.profiles[String(p.captain_id)]||{};var b=document.createElement('button');b.type='button';b.className='party-room'+(String(state.openId)===String(p.id)?' active':'');b.innerHTML='<div class="party-room-head"><b>'+esc(p.game_name)+'</b><small>'+esc(p.status==='full'?'已满':'可加入')+'</small></div><div class="party-room-meta">'+(p.mode?'<span>'+esc(p.mode)+'</span>':'')+(p.server_name?'<span>'+esc(p.server_name)+'</span>':'')+(p.starts_at_text?'<span>'+esc(p.starts_at_text)+'</span>':'')+'<span>'+Number(p.member_count||1)+' / '+(p.capacity||'不限')+'</span></div><small>队长：'+esc(captain.nickname||'研究员')+(p.requires_approval?' · 申请加入':' · 可直接加入')+'</small>';b.addEventListener('click',function(){openParty(p.id)});host.appendChild(b)})}
  async function openParty(id){state.openId=String(id);renderList();var p=state.parties.find(function(x){return String(x.id)===String(id)});if(!p)return renderDetail(null);if(state.user){var msg=await client().from('game_party_messages').select('id,party_id,user_id,content,created_at').eq('party_id',p.id).order('created_at',{ascending:true}).limit(200);state.messages=msg.data||[];var ids=Array.from(new Set(state.messages.map(function(m){return m.user_id}).filter(Boolean)));if(ids.length){var rr=await client().from('profiles').select('id,nickname,avatar_url').in('id',ids);(rr.data||[]).forEach(function(x){state.profiles[String(x.id)]=x})}}renderDetail(p)}
  function renderDetail(p){var host=$('[data-party-detail]');if(!p){host.innerHTML='<div class="party-empty">选择一个组队房间</div>';return}var captain=state.profiles[String(p.captain_id)]||{},me=memberFor(p,state.user),isCaptain=state.user&&String(p.captain_id)===String(state.user.id),accepted=me&&['captain','member','accepted'].includes(me.state)||isCaptain;var members=state.members.filter(function(m){return String(m.party_id)===String(p.id)});var contacts=state.contacts.filter(function(c){return String(c.party_id)===String(p.id)});var html='<h2>'+esc(p.game_name)+'</h2><p class="sub">队长：'+esc(captain.nickname||'研究员')+(p.note?' · '+esc(p.note):'')+'</p><div class="party-info"><div><small>游戏模式</small><b>'+esc(p.mode||'未填写')+'</b></div><div><small>区服</small><b>'+esc(p.server_name||'未填写')+'</b></div><div><small>开黑时间</small><b>'+esc(p.starts_at_text||'未填写')+'</b></div><div><small>人数</small><b>'+Number(p.member_count||1)+' / '+esc(p.capacity||'不限')+'</b></div></div><div class="party-section"><h3>队伍成员</h3>';
    var all=[{user_id:p.captain_id,role:'captain',state:'captain'}].concat(members.filter(function(m){return String(m.user_id)!==String(p.captain_id)}));var seen=new Set();all.forEach(function(m){if(seen.has(String(m.user_id)))return;seen.add(String(m.user_id));var prof=state.profiles[String(m.user_id)]||{};var contact=contacts.find(function(c){return String(c.user_id)===String(m.user_id)});html+='<div class="party-member"><div><b>'+esc(prof.nickname||'研究员')+'</b><span> · '+esc(m.role==='captain'?'队长':m.state==='pending'?'待审核':'队友')+'</span>'+(accepted&&contact&&contact.game_id?'<br><span>游戏 ID：'+esc(contact.game_id)+'</span>':'')+'</div>'+(isCaptain&&m.state==='pending'?'<span><button class="party-btn" data-decide="yes" data-user="'+esc(m.user_id)+'">同意</button> <button class="party-btn" data-decide="no" data-user="'+esc(m.user_id)+'">拒绝</button></span>':'')+'</div>'});html+='</div>';
    if(!state.user)html+='<div class="party-section"><button class="party-btn primary" data-login>登录后加入</button></div>';else if(!isCaptain&&!me)html+='<div class="party-section"><h3>'+(p.requires_approval?'申请加入':'加入房间')+'</h3><form class="party-form" data-join-form><label>你的游戏 ID<input name="gameId" maxlength="60" placeholder="确认加入后向队友显示"></label><label>申请留言<textarea name="message" maxlength="200" placeholder="可不填"></textarea></label><button class="party-btn primary" type="submit">'+(p.requires_approval?'提交申请':'加入房间')+'</button></form></div>';else if(me&&me.state==='pending')html+='<div class="party-section"><p class="sub">申请已提交，等待队长处理。</p></div>';else if(!isCaptain)html+='<div class="party-section"><button class="party-btn" data-leave>退出组队</button></div>';else html+='<div class="party-section"><button class="party-btn" data-close-party>结束并删除房间</button></div>';
    if(accepted){html+='<div class="party-section"><h3>队伍聊天</h3><div class="party-msgs">';state.messages.forEach(function(m){var prof=state.profiles[String(m.user_id)]||{};html+='<div class="party-msg"><b>'+esc(prof.nickname||'研究员')+'</b>'+esc(m.content)+'</div>'});html+='</div><form class="party-chat" data-chat-form><input name="content" maxlength="500" placeholder="说句话"><button class="party-btn primary" type="submit">发送</button></form></div>'}html+='<div class="party-status" data-detail-status></div>';host.innerHTML=html;bindDetail(p)}
  function detailStatus(t,e){var n=$('[data-detail-status]');if(n){n.textContent=t||'';n.classList.toggle('error',!!e)}}async function rpc(name,args){var r=await client().rpc(name,args);if(r.error)throw r.error;return r.data}
  function bindDetail(p){$('[data-login]')&&$('[data-login]').addEventListener('click',function(){window.__FW_OPEN_AUTH__&&window.__FW_OPEN_AUTH__()});var form=$('[data-join-form]');if(form)form.addEventListener('submit',async function(e){e.preventDefault();try{requireUser();detailStatus('正在处理…');var fd=new FormData(form);await rpc('fw_apply_game_party',{p_party_id:Number(p.id),p_game_id:String(fd.get('gameId')||''),p_message:String(fd.get('message')||'')});await load();detailStatus('')}catch(err){detailStatus(err.message||'加入失败。',true)}});$$('[data-decide]').forEach(function(b){b.addEventListener('click',async function(){try{detailStatus('正在处理…');await rpc('fw_decide_game_party',{p_party_id:Number(p.id),p_user_id:b.dataset.user,p_accept:b.dataset.decide==='yes'});await load()}catch(err){detailStatus(err.message||'处理失败。',true)}})});$('[data-leave]')&&$('[data-leave]').addEventListener('click',async function(){try{await rpc('fw_leave_game_party',{p_party_id:Number(p.id)});state.openId='';await load()}catch(err){detailStatus(err.message||'退出失败。',true)}});$('[data-close-party]')&&$('[data-close-party]').addEventListener('click',async function(){if(!confirm('结束房间后会直接删除，确定继续？'))return;try{await rpc('fw_close_game_party',{p_party_id:Number(p.id)});state.openId='';await load()}catch(err){detailStatus(err.message||'删除失败。',true)}});var chat=$('[data-chat-form]');if(chat)chat.addEventListener('submit',async function(e){e.preventDefault();var content=String(new FormData(chat).get('content')||'').trim();if(!content)return;try{await rpc('fw_send_game_party_message',{p_party_id:Number(p.id),p_content:content});chat.reset();await openParty(p.id)}catch(err){detailStatus(err.message||'发送失败。',true)}})}
  $$('[data-filter]').forEach(function(b){b.addEventListener('click',function(){state.filter=b.dataset.filter;$$('[data-filter]').forEach(function(x){x.classList.toggle('active',x===b)});renderList()})});$('[data-party-refresh]').addEventListener('click',function(){load().catch(function(e){setStatus(e.message,true)})});var modal=$('[data-create-modal]');$('[data-party-create]').addEventListener('click',function(){if(!state.user){window.__FW_OPEN_AUTH__&&window.__FW_OPEN_AUTH__();return}modal.hidden=false});$('[data-create-close]').addEventListener('click',function(){modal.hidden=true});modal.addEventListener('click',function(e){if(e.target===modal)modal.hidden=true});$('[data-create-form]').addEventListener('submit',async function(e){e.preventDefault();try{requireUser();setCreateStatus('正在创建…');var fd=new FormData(e.currentTarget),cap=String(fd.get('capacity')||'').trim();var id=await rpc('fw_create_game_party',{p_game_name:String(fd.get('gameName')||'').trim(),p_platform:'',p_server_name:String(fd.get('serverName')||'').trim(),p_mode:String(fd.get('mode')||'').trim(),p_starts_at:null,p_capacity:cap?Number(cap):null,p_note:String(fd.get('note')||'').trim(),p_game_id:String(fd.get('gameId')||'').trim(),p_requires_approval:fd.get('requiresApproval')==='on',p_starts_at_text:String(fd.get('startsAt')||'').trim()});e.currentTarget.reset();modal.hidden=true;state.openId=String(id||'');await load()}catch(err){setCreateStatus(err.message||'创建失败。',true)}});load().catch(function(e){setStatus(e.message||'组队房间读取失败。',true)});
})();
</script>
