<script>
(()=>{
 const tabs=Array.from(document.querySelectorAll('[data-screen]'));
 const tablist=document.querySelector('[role="tablist"]');
 const mobile=matchMedia('(max-width:560px)');
 const orient=()=>tablist.setAttribute('aria-orientation',mobile.matches?'horizontal':'vertical');
 orient();mobile.addEventListener('change',orient);
 const dialog=document.getElementById('image-dialog');
 const image=document.getElementById('dialog-image');
 const title=document.getElementById('dialog-title');
 let opener=null;
 function selectTab(tab,focus=false){
   tabs.forEach(item=>{const active=item===tab;item.setAttribute('aria-selected',String(active));item.tabIndex=active?0:-1;document.getElementById(item.getAttribute('aria-controls')).hidden=!active;});
   if(focus)tab.focus();
 }
 tabs.forEach(tab=>{
   tab.addEventListener('click',()=>selectTab(tab));
   tab.addEventListener('keydown',event=>{
     const index=tabs.indexOf(tab);let next;
     if(event.key==='ArrowRight'||event.key==='ArrowDown')next=tabs[(index+1)%tabs.length];
     if(event.key==='ArrowLeft'||event.key==='ArrowUp')next=tabs[(index-1+tabs.length)%tabs.length];
     if(event.key==='Home')next=tabs[0];
     if(event.key==='End')next=tabs[tabs.length-1];
     if(next){event.preventDefault();selectTab(next,true);}
   });
 });
 document.querySelectorAll('.screenshot-open').forEach(button=>button.addEventListener('click',()=>{
   const screenshot=button.querySelector('img');opener=button;
   image.src=screenshot.getAttribute('src');image.alt=screenshot.alt;title.textContent=screenshot.alt;
   dialog.showModal();document.body.style.overflow='hidden';
 }));
 document.querySelector('.dialog-close').addEventListener('click',()=>dialog.close());
 dialog.addEventListener('click',event=>{if(event.target===dialog||event.target.classList.contains('dialog-layout'))dialog.close();});
 dialog.addEventListener('close',()=>{document.body.style.overflow='';if(opener)opener.focus({preventScroll:true});});
})();
</script>
