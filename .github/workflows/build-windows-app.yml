name: Build Windows App

on:
  push:
    branches:
      - main
    paths:
      - 'desktop-v11/**'
      - 'src-tauri/**'
      - 'package.json'
      - 'package-lock.json'
      - 'assets/icons/**'
      - '.github/workflows/build-windows-app.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-app-release
  cancel-in-progress: false

jobs:
  build-windows-app:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop-v11/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        shell: pwsh
        run: |
          npm ci
          npm --prefix desktop-v11 ci

      - name: Verify Windows 1.1 local frontend
        run: npm --prefix desktop-v11 run test:static

      - name: Build Windows 1.1 NSIS installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: npx tauri build --config src-tauri/tauri.v11.conf.json --bundles nsis

      - name: Prepare website download and updater metadata
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'src-tauri/target/release/bundle/nsis/*-setup.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Windows 1.1 NSIS installer was not generated.' }
          if ($installer.Name -notmatch '1\.1\.1') { throw "Unexpected installer name: $($installer.Name)" }

          $signatureFile = Get-Item "$($installer.FullName).sig" -ErrorAction SilentlyContinue
          if (-not $signatureFile) { throw 'Windows updater signature was not generated.' }

          $currentMetadata = Get-Content 'download/windows-version.json' -Raw | ConvertFrom-Json
          if ($currentMetadata.version -eq '1.0.5' -and (Test-Path 'download/fw-lab-windows-latest.exe')) {
            Copy-Item 'download/fw-lab-windows-latest.exe' 'download/fw-lab-windows-1.0.5-setup.exe' -Force
            if (Test-Path 'download/fw-lab-windows-latest.exe.sig') {
              Copy-Item 'download/fw-lab-windows-latest.exe.sig' 'download/fw-lab-windows-1.0.5-setup.exe.sig' -Force
            }
          }

          Copy-Item $installer.FullName 'download/fw-lab-windows-latest.exe' -Force
          Copy-Item $signatureFile.FullName 'download/fw-lab-windows-latest.exe.sig' -Force

          $hash = (Get-FileHash 'download/fw-lab-windows-latest.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          $publishedAt = (Get-Date).ToUniversalTime().ToString('o')
          $signature = (Get-Content $signatureFile.FullName -Raw).Trim()
          $notes = 'Windows 1.1.1：恢复 F.w 研究所黑粉标准视觉，保留 1.1.0 本地独立前端与性能优化；黑色用于结构与选中状态，粉色用于核心操作。'

          $metadata = @{
            available = $true
            version = '1.1.1'
            platform = 'Windows 10/11 64 位'
            downloadUrl = 'https://fwyanjiusuo.com/download/fw-lab-windows-latest.exe'
            publishedAt = $publishedAt
            sha256 = $hash
            notes = $notes
            rollbackVersion = '1.0.5'
            rollbackUrl = 'https://fwyanjiusuo.com/download/fw-lab-windows-1.0.5-setup.exe'
          }
          $metadata | ConvertTo-Json | Set-Content 'download/windows-version.json' -Encoding utf8

          $updaterMetadata = @{
            version = '1.1.1'
            notes = $notes
            pub_date = $publishedAt
            platforms = @{
              'windows-x86_64' = @{
                signature = $signature
                url = 'https://fwyanjiusuo.com/download/fw-lab-windows-latest.exe'
              }
            }
          }
          $updaterMetadata | ConvertTo-Json -Depth 5 | Set-Content 'download/windows-updater.json' -Encoding utf8

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: fw-lab-windows-1.1.1
          path: |
            download/fw-lab-windows-latest.exe
            download/fw-lab-windows-latest.exe.sig
            download/fw-lab-windows-1.0.5-setup.exe
            download/fw-lab-windows-1.0.5-setup.exe.sig
            download/windows-updater.json
            download/windows-version.json
          if-no-files-found: error

      - name: Publish installer to website
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          publish_dir="$(mktemp -d)"
          trap 'rm -rf "$publish_dir"' EXIT
          cp download/fw-lab-windows-latest.exe "$publish_dir/fw-lab-windows-latest.exe"
          cp download/fw-lab-windows-latest.exe.sig "$publish_dir/fw-lab-windows-latest.exe.sig"
          cp download/windows-updater.json "$publish_dir/windows-updater.json"
          cp download/windows-version.json "$publish_dir/windows-version.json"
          if [ -f download/fw-lab-windows-1.0.5-setup.exe ]; then
            cp download/fw-lab-windows-1.0.5-setup.exe "$publish_dir/fw-lab-windows-1.0.5-setup.exe"
          fi
          if [ -f download/fw-lab-windows-1.0.5-setup.exe.sig ]; then
            cp download/fw-lab-windows-1.0.5-setup.exe.sig "$publish_dir/fw-lab-windows-1.0.5-setup.exe.sig"
          fi

          git fetch origin main
          git reset --hard origin/main

          cp "$publish_dir/fw-lab-windows-latest.exe" download/fw-lab-windows-latest.exe
          cp "$publish_dir/fw-lab-windows-latest.exe.sig" download/fw-lab-windows-latest.exe.sig
          cp "$publish_dir/windows-updater.json" download/windows-updater.json
          cp "$publish_dir/windows-version.json" download/windows-version.json
          if [ -f "$publish_dir/fw-lab-windows-1.0.5-setup.exe" ]; then
            cp "$publish_dir/fw-lab-windows-1.0.5-setup.exe" download/fw-lab-windows-1.0.5-setup.exe
          fi
          if [ -f "$publish_dir/fw-lab-windows-1.0.5-setup.exe.sig" ]; then
            cp "$publish_dir/fw-lab-windows-1.0.5-setup.exe.sig" download/fw-lab-windows-1.0.5-setup.exe.sig
          fi

          if grep -nE '^(<<<<<<<|=======|>>>>>>>)' download/windows-version.json download/windows-updater.json download/fw-lab-windows-latest.exe.sig; then
            echo "Conflict markers detected in Windows release metadata. Refusing to publish."
            exit 1
          fi

          node -e "JSON.parse(require('fs').readFileSync('download/windows-version.json','utf8')); JSON.parse(require('fs').readFileSync('download/windows-updater.json','utf8'));"

          git add download/fw-lab-windows-latest.exe download/fw-lab-windows-latest.exe.sig download/windows-updater.json download/windows-version.json
          if [ -f download/fw-lab-windows-1.0.5-setup.exe ]; then
            git add download/fw-lab-windows-1.0.5-setup.exe
          fi
          if [ -f download/fw-lab-windows-1.0.5-setup.exe.sig ]; then
            git add download/fw-lab-windows-1.0.5-setup.exe.sig
          fi
          if git diff --cached --quiet; then
            echo "No Windows installer changes to commit."
          else
            git commit -m "Release Windows 1.1.1"
            git push origin HEAD:main
          fi
