name: Build Windows App

on:
  push:
    branches:
      - main
    paths:
      - 'src-tauri/**'
      - 'package.json'
      - 'package-lock.json'
      - 'assets/icons/**'
      - 'assets/fw-download-client.js'
      - 'assets/fw-desktop-client.js'
      - 'assets/fw-desktop-client.css'
      - 'assets/app.js'
      - 'tests/desktop-app-static.mjs'
      - '.github/workflows/build-windows-app.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-app-release
  cancel-in-progress: false

jobs:
  build-windows-app:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Run desktop static checks
        run: npm run test:desktop-app

      - name: Build NSIS installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: npm run desktop:build

      - name: Prepare website download
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'src-tauri/target/release/bundle/nsis/*-setup.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Windows NSIS installer was not generated.' }
          $signatureFile = Get-Item "$($installer.FullName).sig" -ErrorAction SilentlyContinue
          if (-not $signatureFile) { throw 'Windows updater signature was not generated.' }
          Copy-Item $installer.FullName 'download/fw-lab-windows-latest.exe' -Force
          Copy-Item $signatureFile.FullName 'download/fw-lab-windows-latest.exe.sig' -Force
          $hash = (Get-FileHash 'download/fw-lab-windows-latest.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          $publishedAt = (Get-Date).ToUniversalTime().ToString('o')
          $signature = (Get-Content $signatureFile.FullName -Raw).Trim()
          $metadata = @{
            available = $true
            version = '1.0.3'
            platform = 'Windows 10/11 64 位'
            downloadUrl = 'https://fwyanjiusuo.com/download/fw-lab-windows-latest.exe'
            publishedAt = $publishedAt
            sha256 = $hash
            notes = '新增软件内更新：以后可直接检查、下载、覆盖安装并自动重启，保留账号、缓存、窗口和浏览位置。'
          }
          $metadata | ConvertTo-Json | Set-Content 'download/windows-version.json' -Encoding utf8
          $updaterMetadata = @{
            version = '1.0.3'
            notes = $metadata.notes
            pub_date = $publishedAt
            platforms = @{
              'windows-x86_64' = @{
                signature = $signature
                url = 'https://fwyanjiusuo.com/download/fw-lab-windows-latest.exe'
              }
            }
          }
          $updaterMetadata | ConvertTo-Json -Depth 5 | Set-Content 'download/windows-updater.json' -Encoding utf8

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: fw-lab-windows-1.0.3
          path: |
            download/fw-lab-windows-latest.exe
            download/fw-lab-windows-latest.exe.sig
            download/windows-updater.json
            download/windows-version.json
          if-no-files-found: error

      - name: Publish installer to website
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git pull --rebase --autostash origin main
          git add download/fw-lab-windows-latest.exe download/fw-lab-windows-latest.exe.sig download/windows-updater.json download/windows-version.json
          if git diff --cached --quiet; then
            echo "No Windows installer changes to commit."
          else
            git commit -m "Build latest Windows app"
            git push origin HEAD:main
          fi
