name: Test Windows 1.1 Preview

on:
  pull_request:
    paths:
      - 'desktop-v11/**'
      - 'assets/fw-user-activity.mjs'
      - 'assets/fw-auth-errors.mjs'
      - 'tests/user-activity.test.mjs'
      - 'src-tauri/tauri.v11.conf.json'
      - '.github/workflows/windows-v11-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-windows-v11-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop-v11/package-lock.json
      - name: Install existing project dependencies
        run: npm ci
      - name: Install Windows 1.1 frontend dependencies
        run: npm --prefix desktop-v11 ci
      - name: Install Chromium
        working-directory: desktop-v11
        run: npx playwright install --with-deps chromium
      - name: Verify desktop optimization regressions
        working-directory: desktop-v11
        run: npx playwright test --config playwright.config.ts optimization.shell.spec.ts own-posts.shell.spec.ts chat-settings.shell.spec.ts ux.shell.spec.ts --grep "后台窗口|阅读历史时|重启恢复|成功发送后草稿|紧凑窗口|检查失败|我的读取失败|投票失败保留时长"
      - name: Test local Windows frontend
        run: npm --prefix desktop-v11 test
      - name: Upload desktop UI results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-membership-previews
          path: |
            /tmp/fw-member-*.png
            desktop-v11/test-results
          if-no-files-found: ignore
          retention-days: 7
