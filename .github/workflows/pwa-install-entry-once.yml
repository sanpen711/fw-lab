name: One-time PWA install entry

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/pwa-install-entry-once.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add PWA install entry
        run: |
          python3 <<'PY'
          import re
          from pathlib import Path

          root = Path('.')
          index_path = root / 'index.html'
          pwa_path = root / 'assets' / 'pwa.js'
          styles_path = root / 'assets' / 'styles.css'

          index = index_path.read_text(encoding='utf-8')

          if 'data-fw-pwa-install-nav' not in index:
              index = index.replace(
                  '  <button class="menu-btn" aria-label="菜单">☰</button>',
                  '  <button class="fw-pwa-install-btn fw-pwa-install-nav" type="button" data-fw-pwa-install data-fw-pwa-install-nav hidden>安装应用</button>\n  <button class="menu-btn" aria-label="菜单">☰</button>',
                  1
              )

          if 'data-fw-pwa-mobile-install' not in index:
              index = index.replace(
                  '        <div class="hero-actions">',
                  '        <div class="fw-pwa-mobile-install" data-fw-pwa-mobile-install hidden>\n          <button class="fw-pwa-mobile-install-btn" type="button" data-fw-pwa-install hidden>添加到桌面</button>\n          <p class="fw-pwa-ios-guide" data-fw-pwa-ios-guide hidden>Safari 分享 → 添加到主屏幕</p>\n        </div>\n        <div class="hero-actions">',
                  1
              )

          index = re.sub(r'href="assets/styles\.css(?:\?v=[^"]+)?"', 'href="assets/styles.css?v=pwa-install-20260522-1"', index, count=1)
          index = re.sub(r'src="assets/pwa\.js(?:\?v=[^"]+)?"', 'src="assets/pwa.js?v=pwa-install-20260522-1"', index, count=1)
          index_path.write_text(index, encoding='utf-8')

          pwa_path.write_text("""// F.w 研究所：PWA 基础注册与安装入口
(function(){
  var savedPrompt = null;
  var installInFlight = false;
  var installed = false;

  function $$(selector){
    return Array.prototype.slice.call(document.querySelectorAll(selector));
  }

  function setHidden(el, hidden){
    if(!el) return;
    if(hidden) el.setAttribute('hidden', '');
    else el.removeAttribute('hidden');
  }

  function isStandalone(){
    return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
  }

  function isIosSafari(){
    var ua = navigator.userAgent || '';
    var iOS = /iphone|ipad|ipod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    var safari = /safari/i.test(ua) && !/crios|fxios|edgios|opios|duckduckgo/i.test(ua);
    return iOS && safari;
  }

  function placeNavButton(){
    var btn = document.querySelector('[data-fw-pwa-install-nav]');
    if(!btn) return;

    var header = btn.closest('.header');
    if(!header) return;

    var userbar = header.querySelector('.fw-userbar');
    var menu = header.querySelector('.menu-btn');

    if(userbar && btn.nextElementSibling !== userbar){
      header.insertBefore(btn, userbar);
    }else if(!userbar && menu && btn.nextElementSibling !== menu){
      header.insertBefore(btn, menu);
    }
  }

  function setButtonText(iosGuide){
    $$('[data-fw-pwa-install]').forEach(function(btn){
      var isNav = btn.hasAttribute('data-fw-pwa-install-nav');
      btn.textContent = iosGuide ? 'Safari 分享 → 添加到主屏幕' : (isNav ? '安装应用' : '添加到桌面');
      btn.classList.toggle('is-ios-guide', !!iosGuide);
      if(iosGuide) btn.setAttribute('aria-disabled', 'true');
      else btn.removeAttribute('aria-disabled');
    });
  }

  function updateInstallUI(){
    placeNavButton();

    var standalone = installed || isStandalone();
    var iosGuide = !standalone && !savedPrompt && isIosSafari();
    var promptReady = !standalone && !!savedPrompt;

    setButtonText(iosGuide);

    $$('[data-fw-pwa-install]').forEach(function(btn){
      var isNav = btn.hasAttribute('data-fw-pwa-install-nav');
      var show = promptReady || (iosGuide && isNav);
      setHidden(btn, !show);
    });

    $$('[data-fw-pwa-mobile-install]').forEach(function(box){
      setHidden(box, !(promptReady || iosGuide));
    });

    $$('[data-fw-pwa-ios-guide]').forEach(function(el){
      setHidden(el, !iosGuide);
    });
  }

  function bindInstallButtons(){
    document.addEventListener('click', function(e){
      var btn = e.target.closest && e.target.closest('[data-fw-pwa-install]');
      if(!btn) return;

      if(btn.getAttribute('aria-disabled') === 'true'){
        e.preventDefault();
        return;
      }

      if(!savedPrompt || installInFlight) return;

      e.preventDefault();
      installInFlight = true;

      var promptEvent = savedPrompt;
      promptEvent.prompt();

      Promise.resolve(promptEvent.userChoice)
        .catch(function(){})
        .then(function(){
          savedPrompt = null;
          installInFlight = false;
          updateInstallUI();
        });
    });
  }

  function bootInstallUI(){
    bindInstallButtons();
    updateInstallUI();

    var header = document.querySelector('.header');
    if(header && window.MutationObserver){
      var timer = 0;
      var observer = new MutationObserver(function(){
        clearTimeout(timer);
        timer = setTimeout(updateInstallUI, 80);
      });
      observer.observe(header, {childList:true, subtree:false});
    }

    document.addEventListener('visibilitychange', function(){
      if(!document.hidden) updateInstallUI();
    });

    if(window.matchMedia){
      var displayMode = window.matchMedia('(display-mode: standalone)');
      if(displayMode.addEventListener) displayMode.addEventListener('change', updateInstallUI);
      else if(displayMode.addListener) displayMode.addListener(updateInstallUI);
    }
  }

  window.addEventListener('beforeinstallprompt', function(e){
    if(isStandalone()) return;
    e.preventDefault();
    savedPrompt = e;
    installed = false;
    updateInstallUI();
  });

  window.addEventListener('appinstalled', function(){
    installed = true;
    savedPrompt = null;
    installInFlight = false;
    updateInstallUI();
  });

  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bootInstallUI);
  else bootInstallUI();

  if('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('/service-worker.js').catch(function(err){
        console.warn('[FW PWA] service worker registration failed', err);
      });
    });
  }
})();
""", encoding='utf-8')

          styles = styles_path.read_text(encoding='utf-8')
          css = """
/* PWA install entry */
.fw-pwa-install-btn[hidden],
.fw-pwa-mobile-install[hidden],
.fw-pwa-ios-guide[hidden]{display:none!important}
.fw-pwa-install-btn{
  min-height:38px;
  padding:0 16px;
  border-radius:999px;
  border:1px solid rgba(246,246,240,.5);
  background:rgba(246,246,240,.1);
  color:var(--white);
  font-size:13px;
  font-weight:950;
  white-space:nowrap;
}
.fw-pwa-install-btn:hover{
  background:var(--accent);
  border-color:var(--accent);
}
.fw-pwa-install-btn.is-ios-guide{
  max-width:220px;
  cursor:default;
}
.fw-pwa-mobile-install{
  margin:24px 0 0;
  max-width:460px;
  padding:16px;
  border:1px solid rgba(246,246,240,.24);
  background:rgba(246,246,240,.09);
  backdrop-filter:blur(10px);
}
.fw-pwa-mobile-install-btn{
  width:100%;
  min-height:52px;
  border:0;
  border-radius:999px;
  background:var(--accent);
  color:var(--white);
  font-weight:1000;
}
.fw-pwa-ios-guide{
  margin:0;
  color:var(--white);
  font-size:15px;
  line-height:1.5;
  font-weight:950;
  text-align:center;
}
@media(min-width:761px){
  .fw-pwa-mobile-install{display:none!important}
}
@media(max-width:760px){
  .fw-pwa-install-nav{display:none!important}
  .fw-pwa-mobile-install:not([hidden]){display:block!important}
}
"""
          if 'PWA install entry' not in styles:
              styles = styles.rstrip() + '\n' + css
              styles_path.write_text(styles, encoding='utf-8')

          workflow = root / '.github' / 'workflows' / 'pwa-install-entry-once.yml'
          if workflow.exists():
              workflow.unlink()
          PY
      - name: Commit PWA install entry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No PWA install entry changes to commit."
            exit 0
          fi
          git commit -m "Add PWA install entry"
          git push
