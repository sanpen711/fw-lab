name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'android-app/**'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Prepare release key
        uses: timheuer/base64-to-file@v1
        with:
          fileName: fw-release.jks
          fileDir: android-app/app
          encodedString: ${{ secrets.FW_RELEASE_KEYSTORE_BASE64 }}

      - name: Build release APK
        env:
          FW_RELEASE_STORE_FILE: fw-release.jks
          FW_RELEASE_STORE_PASSWORD: ${{ secrets.FW_RELEASE_STORE_PASSWORD }}
          FW_RELEASE_KEY_ALIAS: ${{ secrets.FW_RELEASE_KEY_ALIAS }}
          FW_RELEASE_KEY_PASSWORD: ${{ secrets.FW_RELEASE_KEY_PASSWORD }}
        run: gradle -p android-app assembleRelease

      - name: Verify release signature
        run: |
          RELEASE_APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -n "$RELEASE_APKSIGNER"
          "$RELEASE_APKSIGNER" verify --verbose --print-certs android-app/app/build/outputs/apk/release/app-release.apk

      - name: Prepare Android release metadata
        run: |
          node <<'NODE'
          const fs = require('fs');
          const metadata = JSON.parse(fs.readFileSync('android-app/app/build/outputs/apk/release/output-metadata.json', 'utf8'));
          const release = metadata.elements && metadata.elements[0];
          if (!release || !release.versionCode || !release.versionName) throw new Error('Missing Android release version metadata');
          const document = JSON.parse(fs.readFileSync('download/android-version.json', 'utf8'));
          document.versionCode = release.versionCode;
          document.versionName = release.versionName;
          document.apkUrl = 'https://fwyanjiusuo.com/download/';
          document.forceUpdate = false;
          document.notes = '修复客户端内下载入口、断网恢复和启动体验。';
          fs.writeFileSync('/tmp/android-version.json', JSON.stringify(document, null, 2) + '\n');
          NODE

      - name: Publish latest APK into download folder
        run: |
          mkdir -p download
          cp android-app/app/build/outputs/apk/release/app-release.apk /tmp/fw-lab-android-latest.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git pull --rebase --autostash origin main
          cp /tmp/fw-lab-android-latest.apk download/fw-lab-android-latest.apk
          cp /tmp/android-version.json download/android-version.json
          git add download/fw-lab-android-latest.apk download/android-version.json
          if git diff --cached --quiet; then
            echo "No APK changes to commit."
          else
            git commit -m "Build latest release Android APK"
            git push origin HEAD:main
          fi
