name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'android-app/**'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: gradle -p android-app assembleDebug

      - name: Publish latest APK into download folder
        run: |
          mkdir -p download
          cp android-app/app/build/outputs/apk/debug/app-debug.apk download/fw-lab-android-latest.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add download/fw-lab-android-latest.apk
          if git diff --cached --quiet; then
            echo "No APK changes to commit."
          else
            git commit -m "Build latest Android APK"
            git push
          fi
