name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_run:
    workflows:
      - Build Windows App
      - Build Windows Admin App
      - pages build and deployment
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare static official website
        run: node scripts/prepare-web-site.mjs
      - name: Wait for legacy Pages build to finish
        uses: actions/github-script@v7
        with:
          script: |
            // Publish the selected static artifact after the repository's legacy builder.
            await new Promise(resolve => setTimeout(resolve, 10000));
            for (let attempt = 0; attempt < 60; attempt++) {
              const {data} = await github.rest.actions.listWorkflowRunsForRepo({
                ...context.repo, head_sha: context.sha, per_page: 100
              });
              const legacy = data.workflow_runs.filter(run => run.event === 'dynamic');
              if (legacy.every(run => run.status === 'completed')) break;
              if (attempt === 59) throw new Error('Legacy Pages build did not finish');
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
