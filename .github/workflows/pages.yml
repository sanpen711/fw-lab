name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_run:
    workflows:
      - Build Windows App
      - Build Windows Admin App
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop-v11/package-lock.json
      - name: Install browser build dependencies
        run: npm --prefix desktop-v11 ci
      - name: Build browser frontend from shared desktop modules
        run: node scripts/build-web.mjs
      - name: Prepare website and existing mobile PWA
        run: node scripts/prepare-web-site.mjs
      - name: Verify deployment files
        run: node --test web-client/tests/contracts.test.mjs
      - name: Install browser for release checks
        working-directory: desktop-v11
        run: npx playwright install --with-deps chromium
      - name: Verify browser guest and account flows
        run: desktop-v11/node_modules/.bin/playwright test --config web-client/playwright.config.ts
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
