name: Build Windows Admin App

on:
  push:
    branches:
      - main
    paths:
      - 'admin-desktop/**'
      - 'src-tauri/icons/icon.ico'
      - '.github/workflows/build-windows-admin.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-admin-build
  cancel-in-progress: true

jobs:
  build-windows-admin:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: admin-desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './admin-desktop/src-tauri -> target'

      - name: Install dependencies
        working-directory: admin-desktop
        run: npm ci

      - name: Verify management client
        working-directory: admin-desktop
        run: npm test

      - name: Build Windows NSIS installer
        working-directory: admin-desktop
        run: npx tauri build --bundles nsis

      - name: Upload private installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: fw-admin-windows-0.2.0
          path: admin-desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish stable installer download
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $source = Get-ChildItem "admin-desktop/src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          $installer = Join-Path $source.DirectoryName "FW-Admin-0.2.0-Windows-x64-Setup.exe"
          Copy-Item $source.FullName $installer -Force

          gh release view fw-admin-v0.2.0 --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload fw-admin-v0.2.0 $installer --clobber --repo "${{ github.repository }}"
          } else {
            gh release create fw-admin-v0.2.0 $installer `
              --repo "${{ github.repository }}" `
              --target "${{ github.sha }}" `
              --title "FW管理台 0.2.0" `
              --notes "新增安全账号删除、完整内容管理、测试数据隐藏和增强用户详情。" `
              --prerelease
          }
