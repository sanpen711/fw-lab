<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>摸鱼房间｜F.w 研究所</title>
  <meta name="description" content="F.w 研究所：上班族精神休息室。" />
  <link rel="stylesheet" href="assets/styles.css" />
  <link rel="stylesheet" href="assets/auth.css" />
  <style>
    .room-card{cursor:pointer;text-align:left}
    .room-card:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
    .room-online{display:inline-block;margin-top:16px;color:#f0f0e8;font-weight:950;letter-spacing:.02em}
    .fw-room-modal{
      position:fixed;inset:0;z-index:9998;display:none;align-items:center;justify-content:center;
      padding:22px;background:rgba(5,7,5,.72);backdrop-filter:blur(8px)
    }
    .fw-room-modal.show{display:flex}
    .fw-chat-window{
      width:min(920px,96vw);height:min(720px,88vh);display:grid;grid-template-columns:260px 1fr;
      overflow:hidden;background:#f5f1e8;color:#171715;border:1px solid rgba(217,121,121,.55);
      box-shadow:0 28px 90px rgba(0,0,0,.38)
    }
    .fw-chat-sidebar{
      background:#20241f;color:#f6f1e8;border-right:1px solid rgba(255,255,255,.08);
      padding:22px;overflow:auto
    }
    .fw-chat-sidebar small{
      display:block;margin-bottom:8px;color:#d97979;font-weight:950;letter-spacing:.14em;text-transform:uppercase
    }
    .fw-chat-sidebar h3{margin:0 0 8px;font-size:26px;letter-spacing:-.05em}
    .fw-chat-sidebar p{margin:0 0 18px;color:rgba(246,241,232,.72);line-height:1.6;font-weight:760;font-size:13px}
    .fw-online-title{margin:20px 0 10px;color:rgba(246,241,232,.76);font-weight:950;font-size:13px}
    .fw-online-list{display:grid;gap:10px}
    .fw-online-user{
      display:flex;align-items:center;gap:10px;min-width:0;padding:8px;
      border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04)
    }
    .fw-online-user span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:850;font-size:13px}
    .fw-chat-main{display:grid;grid-template-rows:auto 1fr auto;min-width:0;background:linear-gradient(180deg,#f8f4ec,#eee7db)}
    .fw-chat-head{
      display:flex;align-items:center;justify-content:space-between;gap:14px;padding:18px 22px;
      border-bottom:1px solid rgba(28,28,24,.12);background:rgba(255,255,255,.45)
    }
    .fw-chat-head strong{display:block;font-size:20px;letter-spacing:-.04em}
    .fw-chat-head span{display:block;margin-top:4px;color:#696256;font-weight:800;font-size:13px}
    .fw-chat-close{
      width:38px;height:38px;border-radius:999px;border:1px solid rgba(28,28,24,.18);
      background:transparent;font-size:22px;cursor:pointer
    }
    .fw-chat-body{
      padding:24px;overflow:auto;display:flex;flex-direction:column;gap:16px;
      background:linear-gradient(rgba(28,28,24,.035) 1px, transparent 1px),
                 linear-gradient(90deg, rgba(28,28,24,.035) 1px, transparent 1px);
      background-size:28px 28px
    }
    .fw-msg{display:flex;gap:10px;align-items:flex-start;max-width:78%}
    .fw-msg.me{align-self:flex-end;flex-direction:row-reverse}
    .fw-msg-stack{display:grid;gap:5px;min-width:0}
    .fw-msg-name{color:#9d4a4a;font-size:12px;font-weight:950;line-height:1;padding-left:4px}
    .fw-msg.me .fw-msg-name{text-align:right;padding-left:0;padding-right:4px;color:#9d4a4a}
    .fw-bubble{
      padding:12px 14px;border-radius:16px;border:1px solid rgba(28,28,24,.1);
      background:#fffaf0;box-shadow:0 8px 20px rgba(0,0,0,.05)
    }
    .fw-msg.me .fw-bubble{background:#d97979;color:#fff;border-color:#d97979}
    .fw-bubble p{margin:0;line-height:1.55;font-weight:760;white-space:pre-wrap;word-break:break-word}
    .fw-room-empty{
      align-self:center;margin:auto;padding:18px 22px;border:1px dashed rgba(28,28,24,.18);
      color:#746b5d;background:rgba(255,255,255,.45);font-weight:850
    }
    .fw-chat-input{
      display:grid;grid-template-columns:1fr auto;gap:12px;padding:16px 18px;
      border-top:1px solid rgba(28,28,24,.12);background:rgba(255,255,255,.62)
    }
    .fw-chat-input input{
      min-height:46px;border:1px solid rgba(28,28,24,.18);background:#fffdf7;
      padding:0 14px;font:inherit;font-weight:760
    }
    .fw-chat-input button{
      border:0;border-radius:999px;padding:0 22px;background:#1b1b18;color:#fff;font-weight:950;cursor:pointer
    }
    .fw-chat-input button:disabled{opacity:.55;cursor:not-allowed}
    .fw-chat-tip{font-size:12px;color:#736a5d;font-weight:800;margin:0 18px 12px}
    .fw-avatar.room{
      width:34px;height:34px;min-width:34px;border-radius:999px;display:inline-grid;place-items:center;
      overflow:hidden;background:#171715;color:#fff;border:1px solid rgba(217,121,121,.55);
      font-size:11px;font-weight:950
    }
    .fw-avatar.room img{width:100%;height:100%;object-fit:cover}
    @media(max-width:760px){
      .fw-chat-window{grid-template-columns:1fr;height:90vh}
      .fw-chat-sidebar{display:none}
      .fw-msg{max-width:92%}
      .fw-chat-input{grid-template-columns:1fr}
      .fw-chat-input button{min-height:44px}
    }
  </style>
</head>
<body>

<main class="page bg-night">

<header class="header dark">
  <a class="logo" href="index.html">F.w 研究所</a>
  <nav class="nav">
    <a class="" href="index.html">首页</a>
    <a class="" href="square.html">精神广场</a>
    <a class="active" href="rooms.html">摸鱼房间</a>
    <a class="" href="archive.html">废话档案</a>
    <a class="" href="rules.html">入馆须知</a>
  </nav>
  <button class="menu-btn" aria-label="菜单">☰</button>
</header>
<nav class="mobile-nav">
  <a href="index.html">首页</a>
  <a href="square.html">精神广场</a>
  <a href="rooms.html">摸鱼房间</a>
  <a href="archive.html">废话档案</a>

  <a href="admin.html">管理入口</a>
</nav>

  <section class="section">
    <h1 class="hero-title" style="color:var(--white)">摸鱼房间</h1>
    <p class="section-desc">点击房间后，需要先注册 / 登录。登录后会进入聊天窗口；每个房间保留最近 500 条文字消息。</p>

    <div class="rooms-grid">
      <button class="room-card" type="button" data-room="complain">
        <small>实时发泄区</small><h3>今日牢骚房</h3><p>把当天不爽先放这里，不一定要被解决。</p><p class="room-online">推门进去 →</p>
      </button>
      <button class="room-card" type="button" data-room="lowpower">
        <small>安静摸鱼区</small><h3>低功耗休息区</h3><p>不想说太多，只想证明自己还在。</p><p class="room-online">推门进去 →</p>
      </button>
      <button class="room-card" type="button" data-room="nonsense">
        <small>荒诞语录区</small><h3>废话研究室</h3><p>专门研究看似有道理但没有用的话。</p><p class="room-online">推门进去 →</p>
      </button>
      <button class="room-card" type="button" data-room="offline">
        <small>放空聊天区</small><h3>精神离岗室</h3><p>身体在场，意识暂时请假。</p><p class="room-online">推门进去 →</p>
      </button>
      <button class="room-card" type="button" data-room="countdown">
        <small>时间观察区</small><h3>下班倒计时区</h3><p>距离下班还有多久，这件事值得被严肃研究。</p><p class="room-online">推门进去 →</p>
      </button>
      <button class="room-card" type="button" data-room="tea">
        <small>轻聊天区</small><h3>茶水间回声</h3><p>像在茶水间遇到同事一样，随便说两句。</p><p class="room-online">推门进去 →</p>
      </button>
    </div>

    <div class="chat-preview">
      <h2 class="section-title" style="color:var(--white);font-size:54px">房间预览</h2>
      <div class="chat-line"><b>临时研究员 024</b><span>我现在的工作状态像一个开着机但没联网的打印机。</span></div>
      <div class="chat-line"><b>临时研究员 109</b><span>俺也一样。</span></div>
      <div class="chat-line"><b>临时研究员 066</b><span>这句话建议归档。</span></div>
    </div>
  </section>

  <footer class="footer"><span>F.w 研究所</span><span>摸鱼房间 / Chat Rooms</span></footer>
</main>

<div class="fw-room-modal" data-room-modal>
  <div class="fw-chat-window" role="dialog" aria-modal="true" aria-label="摸鱼房间聊天窗口">
    <aside class="fw-chat-sidebar">
      <small data-room-type>ROOM</small>
      <h3 data-room-title>今日牢骚房</h3>
      <p data-room-desc>把当天不爽先放这里，不一定要被解决。</p>
      <div class="fw-online-title">最近出现的人</div>
      <div class="fw-online-list" data-room-users></div>
    </aside>
    <section class="fw-chat-main">
      <header class="fw-chat-head">
        <div>
          <strong data-room-head-title>今日牢骚房</strong>
          <span data-room-head-status>最近 500 条 · 仅文字</span>
        </div>
        <button class="fw-chat-close" type="button" data-room-close>×</button>
      </header>
      <div class="fw-chat-body" data-room-messages></div>
      <form class="fw-chat-input" data-room-form>
        <input name="message" maxlength="300" placeholder="说一句不一定有用的话，最多 300 字..." autocomplete="off" />
        <button type="submit">发送</button>
      </form>
      <p class="fw-chat-tip">仅支持文字；每个房间保留最近 500 条。</p>
    </section>
  </div>
</div>

<script src="assets/app.js"></script>
<script src="assets/auth.js"></script>
<script>
(function(){
  const MAX_LEN = 300;
  const rooms = {
    complain:{type:'实时发泄区',title:'今日牢骚房',desc:'把当天不爽先放这里，不一定要被解决。'},
    lowpower:{type:'安静摸鱼区',title:'低功耗休息区',desc:'不想说太多，只想证明自己还在。'},
    nonsense:{type:'荒诞语录区',title:'废话研究室',desc:'专门研究看似有道理但没有用的话。'},
    offline:{type:'放空聊天区',title:'精神离岗室',desc:'身体在场，意识暂时请假。'},
    countdown:{type:'时间观察区',title:'下班倒计时区',desc:'距离下班还有多久，这件事值得被严肃研究。'},
    tea:{type:'轻聊天区',title:'茶水间回声',desc:'像在茶水间遇到同事一样，随便说两句。'}
  };
  const fallbackUsers=['低功耗研究员','会议幸存者','工位植物','摸鱼观察员','茶水间路人'];

  const modal=document.querySelector('[data-room-modal]');
  const usersBox=document.querySelector('[data-room-users]');
  const msgBox=document.querySelector('[data-room-messages]');
  const form=document.querySelector('[data-room-form]');
  let currentUser=null;
  let currentRoom='';
  let pollTimer=null;

  function toast(msg){
    let t=document.querySelector('.fw-toast');
    if(!t){
      t=document.createElement('div');
      t.className='fw-toast';
      document.body.appendChild(t);
    }
    t.textContent=msg;
    t.classList.add('show');
    clearTimeout(window.__fwRoomToast);
    window.__fwRoomToast=setTimeout(function(){t.classList.remove('show')},2600);
  }

  function escapeHtml(value){
    return String(value||'').replace(/[&<>"']/g,function(ch){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch];
    });
  }

  function avatar(name,url){
    if(url){
      return '<span class="fw-avatar room"><img src="'+escapeHtml(url)+'" alt="'+escapeHtml(name)+'"></span>';
    }
    return '<span class="fw-avatar room">'+escapeHtml(String(name||'FW').slice(0,2))+'</span>';
  }

  function waitForFwDb(){
    return new Promise(function(resolve){
      if(window.fwDb?.enabled) return resolve(true);
      let count=0;
      const timer=setInterval(function(){
        count++;
        if(window.fwDb?.enabled){
          clearInterval(timer);
          resolve(true);
        }
        if(count>40){
          clearInterval(timer);
          resolve(false);
        }
      },100);
    });
  }

  async function getUser(){
    await waitForFwDb();
    if(!window.fwDb?.enabled) return null;
    return await window.fwDb.getCurrentUser().catch(function(){return null});
  }

  function openLogin(){
    const loginBtn=document.querySelector('[data-fw-open], [data-login-cta], [data-sb-open]');
    if(loginBtn) loginBtn.click();
    else toast('请先注册 / 登录。');
  }

  async function fetchProfiles(ids){
    const unique=[...new Set(ids.filter(Boolean))];
    if(!unique.length) return {};
    const result=await window.fwDb.client
      .from('profiles')
      .select('id,nickname,avatar_url')
      .in('id',unique);
    if(result.error) return {};
    const map={};
    (result.data||[]).forEach(function(p){ map[p.id]=p; });
    return map;
  }

  async function loadMessages(roomKey, silent){
    if(!window.fwDb?.client) return;
    if(!silent) msgBox.innerHTML='<div class="fw-room-empty">正在读取房间消息...</div>';

    const result=await window.fwDb.client
      .from('chat_messages')
      .select('id,user_id,content,created_at')
      .eq('room_key',roomKey)
      .eq('is_deleted',false)
      .order('created_at',{ascending:false})
      .limit(500);

    if(result.error){
      msgBox.innerHTML='<div class="fw-room-empty">聊天数据表还没配置。请先在 Supabase 运行 SQL。</div>';
      toast('聊天数据表还没配置，请先运行 SQL。');
      return;
    }

    const rows=(result.data||[]).reverse();
    const profiles=await fetchProfiles(rows.map(function(r){return r.user_id;}));

    renderMessages(rows,profiles);
    renderRecentUsers(rows,profiles);
  }

  function renderMessages(rows,profiles){
    if(!rows.length){
      msgBox.innerHTML='<div class="fw-room-empty">这个房间暂时很安静，推门的人还没说话。</div>';
      return;
    }

    msgBox.innerHTML=rows.map(function(row){
      const profile=profiles[row.user_id]||{};
      const isMe=currentUser && row.user_id===currentUser.id;
      const name=profile.nickname || (isMe ? currentUser.nickname : '研究员');
      const url=profile.avatar_url || (isMe ? currentUser.avatar_url : '');
      return '<div class="fw-msg '+(isMe?'me':'')+'">'
        +avatar(name,url)
        +'<div class="fw-msg-stack">'
        +'<div class="fw-msg-name">'+escapeHtml(name)+(isMe?'（我）':'')+'</div>'
        +'<div class="fw-bubble"><p>'+escapeHtml(row.content)+'</p></div>'
        +'</div></div>';
    }).join('');

    msgBox.scrollTop=msgBox.scrollHeight;
  }

  function renderRecentUsers(rows,profiles){
    const list=[];
    if(currentUser) list.push({nickname:currentUser.nickname||'我',avatar_url:currentUser.avatar_url||'', isMe:true});

    rows.slice().reverse().forEach(function(row){
      const p=profiles[row.user_id];
      if(!p) return;
      if(list.some(function(x){return x.nickname===p.nickname;})) return;
      list.push({nickname:p.nickname||'研究员',avatar_url:p.avatar_url||'', isMe:false});
    });

    fallbackUsers.forEach(function(name){
      if(list.length>=6) return;
      if(!list.some(function(x){return x.nickname===name;})) list.push({nickname:name,avatar_url:'',isMe:false});
    });

    usersBox.innerHTML=list.slice(0,6).map(function(u){
      return '<div class="fw-online-user">'+avatar(u.nickname,u.avatar_url)+'<span>'+escapeHtml(u.nickname)+(u.isMe?'（我）':'')+'</span></div>';
    }).join('');
  }

  function setupRoomHeader(roomKey){
    const room=rooms[roomKey]||rooms.complain;
    document.querySelector('[data-room-type]').textContent=room.type;
    document.querySelector('[data-room-title]').textContent=room.title;
    document.querySelector('[data-room-desc]').textContent=room.desc;
    document.querySelector('[data-room-head-title]').textContent=room.title;
    document.querySelector('[data-room-head-status]').textContent='最近 500 条 · 仅文字';
  }

  function startPolling(){
    clearInterval(pollTimer);
    pollTimer=setInterval(function(){
      if(modal.classList.contains('show') && currentRoom){
        loadMessages(currentRoom,true);
      }
    },5000);
  }

  function closeRoom(){
    modal.classList.remove('show');
    clearInterval(pollTimer);
  }

  async function enterRoom(roomKey){
    const user=await getUser();
    if(!user){
      sessionStorage.setItem('fw_pending_room',roomKey);
      toast('登录后才能进入房间。');
      openLogin();
      return;
    }

    currentUser=user;
    currentRoom=roomKey;
    sessionStorage.removeItem('fw_pending_room');

    setupRoomHeader(roomKey);
    modal.classList.add('show');
    await loadMessages(roomKey,false);
    startPolling();
    setTimeout(function(){form.querySelector('input')?.focus()},120);
  }

  async function checkPendingRoom(){
    const key=sessionStorage.getItem('fw_pending_room');
    if(!key) return;
    const user=await getUser();
    if(user) enterRoom(key);
  }

  document.addEventListener('click',function(e){
    const card=e.target.closest('[data-room]');
    if(card){
      e.preventDefault();
      enterRoom(card.dataset.room);
    }
    if(e.target.closest('[data-room-close]')||e.target===modal){
      closeRoom();
    }
  });

  document.addEventListener('keydown',function(e){
    if(e.key==='Escape') closeRoom();
  });

  form.addEventListener('submit',async function(e){
    e.preventDefault();

    const user=await getUser();
    if(!user){
      toast('登录后才能发言。');
      openLogin();
      return;
    }

    const input=form.querySelector('input');
    const content=input.value.trim();

    if(!content) return;
    if(content.length>MAX_LEN){
      toast('每条消息最多 300 字。');
      return;
    }

    const btn=form.querySelector('button');
    const old=btn.textContent;
    btn.disabled=true;
    btn.textContent='发送中...';

    try{
      const result=await window.fwDb.client
        .from('chat_messages')
        .insert({
          room_key:currentRoom,
          user_id:user.id,
          content:content
        });

      if(result.error) throw result.error;

      input.value='';
      await loadMessages(currentRoom,true);
    }catch(err){
      toast(err.message || '发送失败，请稍后再试。');
    }finally{
      btn.disabled=false;
      btn.textContent=old;
    }
  });

  setInterval(checkPendingRoom,1200);
  setTimeout(checkPendingRoom,1600);
})();
</script>
</body>
</html>
